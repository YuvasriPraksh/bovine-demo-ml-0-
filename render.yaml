services:
  # FastAPI Backend Web Service
  - type: web
    name: bovine-mastitis-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # React + Vite Frontend Static Site
  - type: static_site
    name: bovine-mastitis-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bovine-mastitis-backend
          property: host
